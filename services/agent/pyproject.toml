[project]
name="mipo-agent"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","httpx>=0.28,<1","langchain-openai>=0.3,<1","langgraph>=0.6,<2","pydantic>=2.10,<3","uvicorn[standard]>=0.34,<1"]
[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["mipo_agent*"]
[project.scripts]
mipo-eval="mipo_agent.evaluation.cli:main"
[tool.uv]
package=true
[dependency-groups]
dev=["httpx>=0.28,<1","pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
